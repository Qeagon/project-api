<p-toast />

<div class="container">
  <div class="header">
    <h1> Products</h1>
    <p-button label="Add Product" icon="pi pi-plus" (onClick)="showCreateDialog = true" />
  </div>

  <p-table [value]="products" [tableStyle]="{ 'min-width': '50rem' }" stripedRows>
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr>
        <td>
          <a [routerLink]="['/products',product.id]" class="product-link">   {{ product.name }}  </a>
        </td>
        <td>{{ product.description }}</td>
        <td>€{{ product.price }}</td>
        <td>{{ product.stock }}</td>
        <td>
          <p-button icon="pi pi-pencil" severity="secondary" (onClick)="startEdit(product)" />
          <p-button icon="pi pi-trash" severity="danger" (onClick)="delete(product.id)" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Create dialog -->
<p-dialog header="Add Product" [(visible)]="showCreateDialog" [modal]="true" [style]="{ width: '400px' }">
  <div class="dialog-form">
    <input pInputText [(ngModel)]="newProduct.name" placeholder="Name" />
    <input pInputText [(ngModel)]="newProduct.description" placeholder="Description" />
    <p-inputnumber [(ngModel)]="newProduct.price" placeholder="Price" mode="currency" currency="EUR" />
    <p-inputnumber [(ngModel)]="newProduct.stock" placeholder="Stock" />
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Cancel" severity="secondary" (onClick)="showCreateDialog = false" />
    <p-button label="Save" (onClick)="create()" />
  </ng-template>
</p-dialog>

<!-- Edit dialog -->
<p-dialog header="Edit Product" [(visible)]="showEditDialog" [modal]="true" [style]="{ width: '400px' }">
  <div class="dialog-form" *ngIf="editingProduct">
    <input pInputText [(ngModel)]="editingProduct.name" placeholder="Name" />
    <input pInputText [(ngModel)]="editingProduct.description" placeholder="Description" />
    <p-inputnumber [(ngModel)]="editingProduct.price" placeholder="Price" mode="currency" currency="EUR" />
    <p-inputnumber [(ngModel)]="editingProduct.stock" placeholder="Stock" />
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Cancel" severity="secondary" (onClick)="showEditDialog = false" />
    <p-button label="Save" (onClick)="update()" />
  </ng-template>
</p-dialog>
