<ng-template #productForm let-form>
  <form [formGroup]="form">
    <div class="dialog-form">
      <input pInputText formControlName="name" placeholder="Name" />
      <input pInputText formControlName="description" placeholder="Description" />
      <p-inputnumber formControlName="price" placeholder="Price" mode="currency" currency="EUR" />
      <p-inputnumber formControlName="stock" placeholder="Stock" />
    </div>
  </form>
</ng-template>

<p-table [value]="(products$ | async) ?? []" [tableStyle]="{ 'min-width': '50rem' }" stripedRows>
  <ng-template pTemplate="caption">
    <div class="header">
      <h1>Products</h1>
      <p-button label="Add Product" icon="pi pi-plus" (onClick)="showCreateDialog = true" />
    </div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Price</th>
      <th>Stock</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-product>
    <tr>
      <td>
        <a [routerLink]="['/products', product.id]" class="product-link">{{ product.name }}</a>
      </td>
      <td>{{ product.description }}</td>
      <td>€{{ product.price }}</td>
      <td>{{ product.stock }}</td>
      <td>
        <p-button icon="pi pi-pencil" severity="secondary" (onClick)="startEdit(product)" />
        <p-button icon="pi pi-trash" severity="danger" (onClick)="delete(product.id)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog header="Add Product" [(visible)]="showCreateDialog" [modal]="true" [style]="{ width: '400px' }">
  <ng-container *ngTemplateOutlet="productForm; context: { $implicit: createForm }" />
  <ng-template pTemplate="footer">
    <p-button label="Cancel" severity="secondary" (onClick)="showCreateDialog = false" />
    <p-button label="Save" (onClick)="create()" />
  </ng-template>
</p-dialog>

<p-dialog header="Edit Product" [(visible)]="showEditDialog" [modal]="true" [style]="{ width: '400px' }">
  <ng-container *ngTemplateOutlet="productForm; context: { $implicit: editForm }" />
  <ng-template pTemplate="footer">
    <p-button label="Cancel" severity="secondary" (onClick)="showEditDialog = false" />
    <p-button label="Save" (onClick)="update()" />
  </ng-template>
</p-dialog>
